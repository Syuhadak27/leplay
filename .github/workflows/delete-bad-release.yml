name: Delete bad release

# One-off cleanup for the v0.1.8 playback regression. Run it by pushing a
# `cleanup-*` tag, then remove this workflow together with the tag.
on:
  push:
    tags:
      - 'cleanup-*'

permissions:
  contents: write

jobs:
  delete:
    runs-on: ubuntu-latest
    steps:
      - name: Delete v0.1.8 release and tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release delete v0.1.8 --yes --cleanup-tag || true
          gh api -X DELETE "repos/${GH_REPO}/git/refs/tags/v0.1.8" || true
