name: Delete bad release

# One-off cleanup for the v0.1.8 playback regression. Remove this workflow
# together with the rollback once the release has been deleted.
on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  delete:
    runs-on: ubuntu-latest
    steps:
      - name: Delete v0.1.8 release and tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release delete v0.1.8 --yes --cleanup-tag
